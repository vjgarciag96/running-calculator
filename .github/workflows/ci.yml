name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run build
      - run: npm run size
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          build-args: SITE_URL=https://runningtools.duckdns.org
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.VPS_INFRA_DISPATCH_TOKEN }}
        run: >
          gh api repos/vjgarciag96/vps-infra/dispatches
          -f event_type=image-published
          -f "client_payload[image]=ghcr.io/${{ github.repository }}"
          -f "client_payload[tag]=${{ github.sha }}"
