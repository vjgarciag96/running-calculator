<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title">Running calculator</title>
  <meta name="description" content="">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <script type="module" src="../app.js"></script>
  <link rel="modulepreload" href="../format.js">
  <link rel="modulepreload" href="../inputs.js">
  <link rel="modulepreload" href="../pace.js">
  <link rel="modulepreload" href="../records.js">
  <link rel="modulepreload" href="../strings.js">
</head>
<body>
  <main>
    <h1 data-t="title">Running calculator</h1>
    <p class="lede" data-t="description"></p>
    <form>
      <fieldset>
        <legend data-t="distance">Distance</legend>
        <div class="picker">
          <label><input type="radio" name="preset" value="5k"><span data-t="5k">5K</span></label>
          <label><input type="radio" name="preset" value="10k" checked><span data-t="10k">10K</span></label>
          <label><input type="radio" name="preset" value="half"><span data-t="half">Half</span></label>
          <label><input type="radio" name="preset" value="marathon"><span data-t="marathon">Marathon</span></label>
        </div>
      </fieldset>
      <div class="boxes">
        <div class="box goal">
          <div class="row"><label for="time" data-t="timeField">Finish time</label><span id="time-tag" class="tag" data-t="yourGoal">Your goal</span></div>
          <div class="clock">
            <div class="pairs" aria-hidden="true">
              <span class="pair"><span><span class="zeros"></span><span></span></span><small>hh</small></span><span class="colon">:</span>
              <span class="pair"><span><span class="zeros"></span><span></span></span><small>mm</small></span><span class="colon">:</span>
              <span class="pair"><span><span class="zeros"></span><span></span></span><small>ss</small></span>
              <span class="caret"></span>
            </div>
            <input id="time" name="time" value="5000" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="time-value time-tag help message">
          </div>
          <span id="time-value" class="sr"></span>
        </div>
        <div class="box">
          <div class="row"><label for="pace" data-t="paceField">Pace per km</label><span id="pace-tag" class="tag" data-t="calculated">Calculated</span></div>
          <div class="clock">
            <div class="pairs" aria-hidden="true">
              <span class="pair"><span><span class="zeros"></span><span></span></span><small>mm</small></span><span class="colon">:</span>
              <span class="pair"><span><span class="zeros"></span><span></span></span><small>ss</small></span>
              <span class="caret"></span>
              <span class="unit" data-t="perKm">/km</span>
            </div>
            <input id="pace" name="pace" value="500" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="pace-value pace-tag help">
          </div>
          <span id="pace-value" class="sr"></span>
        </div>
        <p id="message"></p>
        <p id="help" data-t="help">Change either one and the other follows. Your goal stays put when you switch distance.</p>
      </div>
    </form>
    <section aria-labelledby="records">
      <h2 id="records" data-t="records">World records</h2>
      <dl>
        <div class="men"><dt data-t="men">Men</dt><dd class="time"></dd><dd></dd><dd></dd></div>
        <div class="women"><dt data-t="women">Women</dt><dd class="time"></dd><dd></dd><dd></dd></div>
      </dl>
    </section>
    <table>
      <caption data-t="splits">Splits</caption>
      <thead><tr><th scope="col" data-t="km">km</th><th scope="col" data-t="split">Split</th><th scope="col" data-t="total">Total</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
</body>
</html>
